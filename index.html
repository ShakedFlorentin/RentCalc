<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#bc002d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="יפן" />
    <link rel="icon" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>הטיול ליפן</title>
    <!-- light or dark and the language picked in settings, applied before the first paint so the page never flashes the other -->
    <script>
      try {
        var theme = localStorage.getItem('theme')
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
        // English picked in settings: left to right from the first paint
        if (localStorage.getItem('lang') === 'en') {
          document.documentElement.lang = 'en'
          document.documentElement.dir = 'ltr'
          document.title = 'Japan trip'
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
